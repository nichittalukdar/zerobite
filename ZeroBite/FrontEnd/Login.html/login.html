<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Bite - Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #1a0b2e; /* fallback while the photo loads */
      position: relative;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -6%;
      z-index: -1;
      background-image: url("D:/ZeroBite/Images/signup and login background.png");
      background-position: center;
      background-size: cover;
      animation: slowDrift 25s ease-in-out infinite alternate;
    }

    @keyframes slowDrift {
      from {
        transform: scale(1.02) translate(0, 0);
      }
      to {
        transform: scale(1.12) translate(-1%, -1%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }
    }

    .auth-layout {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .scramble {
      color: white;
      text-align: center;
      font-size: clamp(36px, 12vw, 88px);
      letter-spacing: 8px;
      text-shadow: 0 0 24px rgba(199, 125, 255, 0.55);
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 40px 36px;
      color: white;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sub {
      text-align: center;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 32px;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.85);
    }

    input {
      width: 100%;
      padding: 13px 16px;
      margin-bottom: 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input:focus {
      outline: none;
      border-color: #c77dff;
      background: rgba(255, 255, 255, 0.12);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #7b2cbf, #c77dff);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn:hover {
      opacity: 0.92;
    }

    .footer-links {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .footer-links a {
      color: #c77dff;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .msg {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      min-height: 20px;
    }

    .msg.error {
      color: #ff6b6b;
    }

    .msg.success {
      color: #69db7c;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="auth-layout">
    <h1 class="scramble">ZERO BITE</h1>

    <div class="card">
      <p class="sub">Welcome back.<br>Let's rescue some food.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button type="submit" class="btn">Login</button>
      </form>

      <div class="footer-links">
        Don't have an account? <a href="signup.html">Sign up</a>
      </div>

      <div class="msg" id="msg" aria-live="polite"></div>
    </div>
  </main>

  <script>
    // Animate the headline when the page loads.
    const title = document.querySelector(".scramble");

    if (title && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const finalText = title.textContent;
      const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*";
      const duration = 2500;
      const startTime = performance.now();

      function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const lockedCharacters = Math.floor(progress * finalText.length);

        title.textContent = [...finalText]
          .map((character, index) => {
            if (character === " " || index < lockedCharacters) {
              return character;
            }

            return characters[Math.floor(Math.random() * characters.length)];
          })
          .join("");

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          title.textContent = finalText;
        }
      }

      requestAnimationFrame(animate);
    }

    // Demo login behavior. Connect this form to your backend for real login.
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const message = document.getElementById("msg");

      if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        message.className = "msg error";
        return;
      }

      message.textContent = "Login system will connect to the backend soon.";
      message.className = "msg success";
    });
  </script>
</body>
</html>
